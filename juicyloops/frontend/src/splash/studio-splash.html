<!--
  Studio splash: "one bar, then the loop opens". One bar of 4/4 at the app's default 136 BPM
  (beat 441 ms, 32nd triplet 36.75 ms). Inlined into the studio shell only: `scripts/prerender/prerender.mjs`
  replaces the `app-splash` placeholder comment in dist/app/index.html with this file, the dev server does the same for /app URLs
  (plugin in vite.config.ts); every other page gets the placeholder removed. Comments like this one and leading
  indentation are stripped on the way in.

  Timeline (pure CSS; the script only decides when beat 4 starts):
    beat 1  0-441     the mark alone at the centre: playhead draws the ring from 12 o'clock, the 19 bars trigger left to right (23 ms apart)
    beat 2  441-882   the lockup glides the mark into place (220 ms) while the wordmark letters stamp in on 32nd triplets, the readout counts 1.1.1 ... 1.4.1 per beat
    beat 3  882-1323  the kick: the mark punches, the glow flares, the bars dip like a meter
    beat 4  1323-     `jls-open`: the ring scales past the viewport while a hole in the splash backdrop (a
                      radial mask) grows with its inner edge (the studio shows through the ring); wordmark and readout fall away
  Not ready at beat 4 (no `.modecard` in #app yet): `jls-hold` loops the kick on every beat while the readout keeps
  counting (1.4.1, 2.1.1, ...), and beat 4 plays on the first beat the studio is there (6 s cap).
  Any pointer or key skips to a 200 ms reveal. Reduced motion: static lockup, then a 250 ms cross-fade.
  Shown once per tab: sessionStorage `juicyloops:splash` (test harnesses set it to skip the splash).
  Entering the studio client side (a RouterLink from a marketing page) plays this same file: `playSplash.ts` appends it
  to <body> from a router guard before the studio renders.
-->
<style id="jl-splash-style">
    @font-face {
        font-family: 'jls-mono';
        font-display: block;
        src: url('/fonts/share-tech-mono-latin-400-normal.woff2') format('woff2');
    }
    #jl-splash-bg, #jl-splash { display: none; }
    .jls-on #jl-splash-bg { display: block; position: fixed; inset: 0; z-index: 2147483000; background: #0a0913; }
    .jls-on #jl-splash {
        --m: min(12.5vw, 150px, 22vh);
        --b: 441ms;
        --s: 36.75ms;
        --glow: drop-shadow(0 0 calc(var(--m) * 0.045) rgba(224, 64, 251, 0.5));
        display: grid;
        place-items: center;
        position: fixed;
        inset: 0;
        z-index: 2147483200;
        overflow: hidden;
        contain: strict;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    .jls-lockup {
        /* Beat 1 plays with the mark alone at the viewport centre; the lockup glides into place while the letters stamp. */
        --jls-off: calc(var(--m) * 2.235) 0;
        display: flex;
        align-items: center;
        gap: calc(var(--m) * 0.25);
        animation: jls-glide 220ms cubic-bezier(0.2, 0.8, 0.2, 1) var(--b) both;
    }
    .jls-door { flex: none; width: var(--m); height: var(--m); will-change: transform; }
    .jls-mark { width: 100%; height: 100%; animation: jls-punch 180ms cubic-bezier(0.2, 0.8, 0.3, 1) calc(var(--b) * 2) both; }
    .jls-mark svg { display: block; width: 100%; height: 100%; overflow: visible; filter: var(--glow); animation: jls-flare 360ms ease-out calc(var(--b) * 2) both; }
    .jls-ring { stroke-dasharray: 276.46; stroke-dashoffset: 276.46; animation: jls-draw var(--b) linear both; }
    .jls-ph { transform-box: view-box; transform-origin: 60px 60px; animation: jls-orbit var(--b) linear both, jls-out 70ms linear var(--b) both; }
    .jls-bars { transform-box: fill-box; transform-origin: center; animation: jls-dip 300ms ease-out calc(var(--b) * 2) both; }
    .jls-bars rect { transform-box: fill-box; transform-origin: center; animation: jls-step 260ms cubic-bezier(0.3, 0.7, 0.4, 1) calc(var(--i) * 23ms) both; }
    .jls-bars .jls-dot { animation-name: jls-pop; animation-duration: 200ms; }
    .jls-word { display: block; width: calc(var(--m) * 4.22); height: auto; overflow: visible; }
    .jls-word path { transform-box: fill-box; transform-origin: 50% 100%; animation: jls-stamp 140ms cubic-bezier(0.2, 0.8, 0.3, 1) calc(var(--b) + var(--i) * var(--s)) both; }
    .jls-count {
        position: absolute;
        left: 50%;
        top: calc(50% + var(--m) * 0.82);
        translate: -50% 0;
        padding-left: 0.22em;
        font: 400 max(12px, calc(var(--m) * 0.1)) / 1 'jls-mono', ui-monospace, monospace;
        letter-spacing: 0.22em;
        color: #928bb8;
    }
    .jls-count::after { content: '1.1.1'; animation: jls-count calc(var(--b) * 4) step-end both; }
    .jls-hold .jls-count::after { content: attr(data-v); animation: none; }
    .jls-hold .jls-mark { animation: jls-kick var(--b) cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
    .jls-hold .jls-mark svg { animation: jls-flare var(--b) ease-out infinite; }
    .jls-hold .jls-bars { animation: jls-dip var(--b) ease-out infinite; }

    .jls-open #jl-splash-bg, .jls-open #jl-splash { pointer-events: none; }
    .jls-open .jls-word, .jls-open .jls-count { animation: jls-fall 160ms cubic-bezier(0.5, 0, 0.9, 0.5) both; }
    .jls-open .jls-mark { animation: none; }
    .jls-open .jls-mark svg { animation: jls-unglow 110ms linear both; }
    .jls-open .jls-bars { animation: jls-out 80ms linear both; }
    .jls-open .jls-door { transform: scale(var(--jls-s)); animation: jls-door var(--jls-dur) var(--jls-ease) both, jls-out calc(var(--jls-dur) * 0.35) linear calc(var(--jls-dur) * 0.65) both; }
    /*
     * The ring's scale and the backdrop hole are both custom property animations, so they advance on the same main
     * thread frame: a transform animation would run ahead on the compositor while the studio mounts and the hole
     * (a repainted mask) would trail behind it.
     */
    @property --jls-hole { syntax: '<length>'; inherits: false; initial-value: 0px; }
    @property --jls-s { syntax: '<number>'; inherits: false; initial-value: 1; }
    @media (prefers-reduced-motion: no-preference) {
        .jls-open #jl-splash-bg {
            -webkit-mask-image: radial-gradient(circle at var(--jls-cx) var(--jls-cy), transparent var(--jls-hole), #000 calc(var(--jls-hole) + 0.75px));
            mask-image: radial-gradient(circle at var(--jls-cx) var(--jls-cy), transparent var(--jls-hole), #000 calc(var(--jls-hole) + 0.75px));
            animation: jls-hole var(--jls-dur) var(--jls-ease) both;
        }
    }

    @media (orientation: portrait) and (max-aspect-ratio: 4/5) {
        .jls-on #jl-splash { --m: min(40vw, 200px, 28vh); }
        .jls-lockup { flex-direction: column; gap: calc(var(--m) * 0.16); }
        .jls-lockup { --jls-off: 0 calc((var(--m) * 0.16 + min(80vw, calc(var(--m) * 2.4)) * 0.11374) / 2); }
        .jls-word { width: min(80vw, calc(var(--m) * 2.4)); }
        .jls-count { top: calc(50% + (var(--m) * 1.16 + min(80vw, calc(var(--m) * 2.4)) * 0.11374) / 2 + var(--m) * 0.26); }
    }

    @media (prefers-reduced-motion: reduce) {
        #jl-splash *, #jl-splash *::after { animation: none !important; }
        .jls-ring { stroke-dashoffset: 0; }
        .jls-ph, .jls-count { display: none; }
        .jls-open #jl-splash-bg, .jls-open #jl-splash { animation: jls-out var(--jls-dur) linear both; }
    }

    @keyframes jls-draw { to { stroke-dashoffset: 0; } }
    @keyframes jls-orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes jls-out { to { opacity: 0; } }
    @keyframes jls-step {
        0% { transform: scaleY(var(--s0)); }
        50% { transform: scaleY(1.14); }
        78% { transform: scaleY(0.96); }
        100% { transform: none; }
    }
    @keyframes jls-pop {
        0% { transform: none; }
        40% { transform: scale(1.8); }
        100% { transform: none; }
    }
    @keyframes jls-stamp {
        0% { transform: scaleY(0) skewX(-14deg); }
        45% { transform: scaleY(1.14) skewX(4deg); }
        75% { transform: scaleY(0.97) skewX(-1deg); }
        100% { transform: none; }
    }
    @keyframes jls-count {
        0% { content: '1.1.1'; }
        25% { content: '1.2.1'; }
        50% { content: '1.3.1'; }
        75%, 100% { content: '1.4.1'; }
    }
    @keyframes jls-punch {
        0% { transform: none; }
        28% { transform: scale(1.045); }
        100% { transform: none; }
    }
    @keyframes jls-kick {
        0% { transform: none; }
        11% { transform: scale(1.045); }
        41%, 100% { transform: none; }
    }
    @keyframes jls-flare {
        0% { filter: var(--glow); }
        22% { filter: drop-shadow(0 0 calc(var(--m) * 0.14) rgba(255, 79, 139, 0.9)); }
        100% { filter: var(--glow); }
    }
    @keyframes jls-unglow {
        from { filter: var(--glow); }
        to { filter: drop-shadow(0 0 0 rgba(224, 64, 251, 0)); }
    }
    @keyframes jls-dip {
        0% { transform: none; }
        22% { transform: scaleY(0.78); }
        100% { transform: none; }
    }
    @keyframes jls-fall { to { opacity: 0; transform: translateY(calc(var(--m) * 0.14)); } }
    @keyframes jls-glide { from { translate: var(--jls-off); } to { translate: none; } }
    @keyframes jls-door {
        from { --jls-s: 1; }
        to { --jls-s: var(--jls-scale); }
    }
    @keyframes jls-hole {
        from { --jls-hole: var(--jls-r0); }
        to { --jls-hole: var(--jls-r1); }
    }
</style>
<script>
    (function () {
        /* In the shell only on /app; `data-spa` marks a client side entry into the studio (src/splash/playSplash.ts). */
        var script = document.currentScript;
        var entry = /^\/app(\/|$)/.test(location.pathname) || (script !== null && script.hasAttribute('data-spa'));
        var on = entry && document.visibilityState !== 'hidden';
        try {
            if (on && sessionStorage.getItem('juicyloops:splash')) {
                on = false;
            } else if (on) {
                sessionStorage.setItem('juicyloops:splash', '1');
            }
        } catch (e) {}
        if (on) {
            document.documentElement.classList.add('jls-on');
        }
    })();
</script>

<script>
    (function () {
        var root = document.documentElement;
        var splash = document.getElementById('jl-splash');
        var parts = [splash, document.getElementById('jl-splash-bg'), document.getElementById('jl-splash-style')];
        var vars = ['--jls-cx', '--jls-cy', '--jls-r0', '--jls-r1', '--jls-scale', '--jls-dur', '--jls-ease'];
        var drop = function () {
            parts.forEach(function (node) {
                if (node) node.remove();
            });
            root.classList.remove('jls-on', 'jls-hold', 'jls-open');
            vars.forEach(function (name) {
                root.style.removeProperty(name);
            });
            removeEventListener('keydown', skip, true);
        };
        if (!root.classList.contains('jls-on')) {
            drop();
            return;
        }

        var BEAT = 441;
        var CAP = 6000;
        var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var count = splash.querySelector('.jls-count');
        var t0 = performance.now();
        var state = 'intro';
        var bar = 1;
        var beat = 4;
        var next = 3;
        var timer = 0;

        /* The CSS timeline starts with the first frame; align the beat grid to it. */
        var first = splash.getAnimations ? splash.getAnimations({ subtree: true })[0] : null;
        if (first) {
            first.ready.then(function () {
                if (first.startTime !== null) t0 = Number(first.startTime);
            });
        }

        var elapsed = function () {
            return performance.now() - t0;
        };
        var ready = function () {
            return document.querySelector('#app .modecard') !== null;
        };
        var at = function (ms, callback) {
            clearTimeout(timer);
            timer = setTimeout(callback, Math.max(0, t0 + ms - performance.now()));
        };

        var open = function (duration) {
            if (state === 'open') return;
            state = 'open';
            clearTimeout(timer);
            /* A skip during beat 1 lands the mark in its lockup place first: the doorway opens from there. */
            splash.querySelector('.jls-lockup').getAnimations().forEach(function (animation) {
                animation.finish();
            });
            var ring = splash.querySelector('.jls-ring').getBoundingClientRect();
            var cx = ring.left + ring.width / 2;
            var cy = ring.top + ring.height / 2;
            var r0 = ((ring.width / 2) * 41.5) / 44;
            var r1 = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy)) + 4;
            var set = function (name, value) {
                root.style.setProperty(name, value);
            };
            set('--jls-cx', cx + 'px');
            set('--jls-cy', cy + 'px');
            set('--jls-r0', r0 + 'px');
            set('--jls-r1', r1 + 'px');
            set('--jls-scale', String(r1 / r0));
            set('--jls-dur', duration + 'ms');
            set('--jls-ease', duration < BEAT ? 'cubic-bezier(0.5, 0, 0.3, 1)' : 'cubic-bezier(0.7, 0, 0.3, 1)');
            root.classList.add('jls-open');
            setTimeout(drop, duration + 34);
        };

        /* Beat boundaries from beat 4 on: open if the studio is there, else loop the kick and keep counting. */
        var tick = function () {
            if (state === 'open') return;
            if (ready() || elapsed() >= CAP) {
                open(still ? 250 : BEAT);
                return;
            }
            if (state === 'intro') {
                state = 'hold';
                root.classList.add('jls-hold');
            } else {
                beat += 1;
                if (beat > 4) {
                    beat = 1;
                    bar += 1;
                }
                count.setAttribute('data-v', bar + '.' + beat + '.1');
            }
            next += 1;
            at(next * BEAT, tick);
        };
        at(next * BEAT, tick);

        /* Skip: a fast reveal as soon as the studio is there. */
        var poll = function () {
            if (state === 'open') return;
            if (ready() || elapsed() >= CAP) {
                open(still ? 250 : 200);
            } else {
                setTimeout(poll, 50);
            }
        };
        var skip = function () {
            poll();
        };
        splash.addEventListener('pointerdown', skip);
        addEventListener('keydown', skip, true);
    })();
</script>
