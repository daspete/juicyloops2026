    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('juicyloops:theme'); } catch (e) {}
        var light = stored ? stored === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
        if (!light) document.documentElement.classList.add('dark');
      })();
    </script>
