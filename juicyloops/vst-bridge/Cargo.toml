[package]
name = "juicyloops-vst-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Hosts native CLAP and VST3 plugins on the desktop and plays them for the Juicy Loops studio in the browser."
publish = false
license = "LicenseRef-Proprietary"

[lib]
name = "vst_bridge"
path = "src/lib.rs"

[[bin]]
name = "juicyloops-bridge"
path = "src/main.rs"

[features]
default = ["gui"]
# Plugin editor windows (winit). Without it the bridge is headless: no plugin windows.
gui = ["dep:winit"]

[dependencies]
base64 = "0.22"
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "note-ports", "gui", "params", "state", "latency", "log", "timer", "posix-fd", "raw-window-handle_06"] }
clack-host = "0.2"
crossbeam-channel = "0.5"
getrandom = "0.3"
libloading = "0.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
vst3 = "0.3"
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Puts the app icon and version info into juicyloops-bridge.exe (build.rs, assets/windows.rc). Only used for Windows.
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
