worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    access_log    off;
    error_log     /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json application/ld+json;

    server {
        listen       3000;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Prerendered pages live at /index.html and /imprint/index.html; the studio is a client-only
        # app whose empty shell sits at /app/index.html.
        location /app {
            try_files $uri /app/index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Pages and the sitemap change with every deploy: always revalidate them.
        location ~* \.(?:html|xml|txt|webmanifest)$ {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff;
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        error_page 404 /index.html;
    }
}