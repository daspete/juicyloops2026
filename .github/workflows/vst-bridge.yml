# Builds the Juicy Loops Bridge (juicyloops/vst-bridge) for Linux, Windows and macOS on every push to main that
# changes it (or this workflow), and on demand. Signing is left out on purpose (secrets); see its README "Building".
name: vst-bridge

on:
  push:
    branches: [main]
    paths: ['juicyloops/vst-bridge/**', '.github/workflows/vst-bridge.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: juicyloops/vst-bridge

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check.sh
      - run: bash scripts/test.sh --fixtures
      - run: bash scripts/build.sh
      - run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: juicyloops-bridge-linux-windows
          path: juicyloops/vst-bridge/dist/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --locked --lib
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: juicyloops-bridge-macos
          path: juicyloops/vst-bridge/dist/macos/
